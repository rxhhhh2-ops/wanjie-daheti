<!doctype html>
<html lang="zh-CN" data-page="liuren">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大六壬课盘</title>
<style>
:root{
  --font-size-base:14px;
  --background:#f6f3ec; --foreground:#2b2620;
  --card:#fffdf7; --card-foreground:#2b2620;
  --muted:#ece7da; --muted-foreground:#6f6656;
  --border:#d8d0bd; --input:#d8d0bd;
  --accent:#efe9da; --accent-foreground:#2b2620;
  --primary:#8a3324; --primary-foreground:#fdf9f0;
  --popover:#fffdf7; --popover-foreground:#2b2620;
  --green:#3d7a46; --red:#a83a2e; --yellow:#9a7b23; --purple:#6b4d8f; --blue:#2f5f8a;
}
@media (prefers-color-scheme: dark){ :root{
  --background:#211d18; --foreground:#e8e1d3;
  --card:#2a251e; --card-foreground:#e8e1d3;
  --muted:#332d25; --muted-foreground:#a89e8a;
  --border:#4a4234; --input:#4a4234;
  --accent:#3a332a; --accent-foreground:#e8e1d3;
  --primary:#c96a52; --primary-foreground:#211d18;
  --popover:#2a251e; --popover-foreground:#e8e1d3;
  --green:#7fb08a; --red:#d98877; --yellow:#cbb268; --purple:#a58cc4; --blue:#7aa5c9;
}}
*{box-sizing:border-box}
body{margin:0 auto; padding:18px 20px 40px; max-width:980px;
  background:var(--background); color:var(--foreground);
  font:var(--font-size-base)/1.55 "Source Han Serif SC","Noto Serif SC","Songti SC",SimSun,serif;}
h3{font-size:calc(var(--font-size-base) + 4px); margin:0 0 10px; font-weight:500;}
.text-small{font-size:12px}
.text-muted{color:var(--muted-foreground)}
.form-label{display:block; font-size:12px; color:var(--muted-foreground); margin:0 0 2px;}
.form-control,.form-select{font:inherit; font-size:13px; color:var(--foreground);
  background:var(--card); border:1px solid var(--border); border-radius:6px; padding:5px 8px; height:30px;}
.btn{font:inherit; font-size:13px; color:var(--foreground); background:var(--card);
  border:1px solid var(--border); border-radius:6px; padding:5px 12px; height:30px; cursor:pointer;}
.btn:hover{background:var(--accent)}
.btn-primary{background:var(--primary); color:var(--primary-foreground); border-color:var(--primary);}
.btn-primary:hover{filter:brightness(1.06)}
.btn-sm{height:28px; padding:4px 10px;}
.viz-controls{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end;
  border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--card);}
.tooltip{position:absolute; z-index:var(--z-overlay,250); max-width:280px; padding:6px 9px;
  background:var(--popover); color:var(--popover-foreground);
  border:1px solid var(--border); border-radius:8px; font-size:12px; pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,.18);}
</style>
<script>
// 导出环境的 window.zcode 兜底（状态存 localStorage）
if (!(window.zcode && window.zcode.setWidgetState)){
  window.zcode = {
    widgetState: (() => { try { return JSON.parse(localStorage.getItem("lp-state") || "null"); }
                          catch(e){ return null; } })(),
    setWidgetState(s){ try { localStorage.setItem("lp-state", JSON.stringify(s)); } catch(e){} 
                        return Promise.resolve(); }
  };
}
</script>
<link rel="stylesheet" href="../assets/suite.css">
<link rel="stylesheet" href="../assets/themes.css">
<script src="../assets/suite.js"></script>
<script src="../assets/suite-data.js" defer></script>
<script src="../assets/suite-bridge.js" defer></script>
<script src="../assets/yingqi.js"></script>

<body>
<div id="lp-root">
<style>
#lp-root { --lp-glyph: calc(var(--font-size-base) * 1.9); }
#lp-board { display:grid; grid-template-columns:repeat(4,minmax(72px,1fr)); gap:3px; max-width:360px; }
#lp-root .lp-cell { border:1px solid var(--border); border-radius:6px; padding:3px 5px; min-height:58px; text-align:center; }
#lp-root .lp-cell.is-san { border:2px solid var(--accent); }
#lp-root .lp-cell.is-kong { opacity:.62; }
#lp-root .lp-corner { border:transparent; }
#lp-root .lp-glyph { font-size:var(--lp-glyph); line-height:1.15; }
#lp-root .lp-ke { width:76px; flex:0 0 76px; text-align:center; box-sizing:border-box; }
#lp-root .lp-kecol { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
#lp-root .lp-chuan { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
#lp-root .lp-chip { display:inline-block; border:1px solid var(--border); border-radius:999px; padding:0 8px; margin:2px 2px 0 0; }
#lp-root .lp-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:2px; vertical-align:middle; }
#lp-root .lp-h { font-weight:500; margin:8px 0 3px; }
#lp-root .lp-main { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
#lp-root .lp-aibar { border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin:4px 0 8px; }
#lp-root .lp-aipanel { display:none; margin-top:6px; }
#lp-root .lp-aipanel.open { display:block; }
#lp-root .lp-airun { margin-top:8px; }
#lp-root #lp-ai-out { white-space:pre-wrap; }
#lp-root #lp-ai-out:empty { display:none; }
</style>
<h3>大六壬课盘</h3>
<div class="lp-aibar">
  <button class="btn btn-sm btn-outline-secondary" id="lp-ai-toggle" type="button">AI 配置 ▾</button>
  <span class="text-small text-muted" id="lp-ai-status" style="margin-left:8px;">未配置（不影响排盘与规则解盘）</span>
  <div class="lp-aipanel" id="lp-ai-panel">
    <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
      <label class="form-label" for="lp-ai-url" style="margin:0;">API 端点</label>
      <input class="form-control form-control-sm" id="lp-ai-url" style="width:330px;" placeholder="https://api.openai.com/v1（自动补 /chat/completions）">
      <label class="form-label" for="lp-ai-key" style="margin:0;">Key</label>
      <input class="form-control form-control-sm" id="lp-ai-key" type="password" autocomplete="off" style="width:190px;">
      <label class="form-label" for="lp-ai-model" style="margin:0;">模型</label>
      <input class="form-control form-control-sm" id="lp-ai-model" style="width:180px;" placeholder="gpt-4o-mini / deepseek-chat">
    </div>
    <div style="display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap; margin-top:6px;">
      <label class="form-label" for="lp-ai-persona" style="margin:0;">解答人设</label>
      <select class="form-select form-select-sm" id="lp-ai-persona" style="width:210px;"></select>
      <textarea class="form-control form-control-sm" id="lp-ai-sys" rows="3" style="flex:1; min-width:320px;" placeholder="人设（system prompt），可自由编辑"></textarea>
    </div>
    <div style="margin-top:6px;">
      <button class="btn btn-sm btn-primary" id="lp-ai-save" type="button">保存配置</button>
      <button class="btn btn-sm btn-outline-secondary" id="lp-ai-test" type="button">测试连接</button>
      <span class="text-small text-muted" style="margin-left:8px;">配置仅保存在本机 localStorage；共用电脑请勿保存 Key。</span>
    </div>
  </div>
</div>
<div class="viz-controls" role="group" aria-label="排盘输入">
  <label class="form-label" for="lp-date">公历日期</label>
  <input class="form-control form-control-sm" type="date" id="lp-date" value="2026-10-29">
  <label class="form-label" for="lp-time">时间</label>
  <input class="form-control form-control-sm" type="time" id="lp-time" value="12:00" step="300">
  <label class="form-label" for="lp-zhan">占事</label>
  <select class="form-select form-select-sm" id="lp-zhan">
    <option value="">（不限）</option><option>天时</option><option>家宅</option><option>疾病</option>
    <option>婚姻</option><option>求财</option><option>功名</option><option>官职</option>
    <option>出行</option><option>行人</option><option>贼盗</option><option>讼狱</option><option>失物</option>
  </select>
  <label class="form-label" for="lp-dn">昼夜</label>
  <select class="form-select form-select-sm" id="lp-dn">
    <option value="auto">自动</option><option value="day">昼</option><option value="night">夜</option>
  </select>
  <label class="form-label" for="lp-jiang">月将</label>
  <select class="form-select form-select-sm" id="lp-jiang"><option value="auto">自动</option></select>
  <label class="form-label" for="lp-order">贵人派</label>
  <select class="form-select form-select-sm" id="lp-order">
    <option value="p1">派一（甲昼丑）</option><option value="p2">派二（甲昼未）</option>
  </select>
  <label class="form-label" for="lp-shenhai">涉害</label>
  <select class="form-select form-select-sm" id="lp-shenhai">
    <option value="depth">深浅历数</option><option value="mengzhong">孟仲季</option>
  </select>
  <label class="form-label" for="lp-xiake">一课下神</label>
  <select class="form-select form-select-sm" id="lp-xiake">
    <option value="gan">日干五行</option><option value="jigong">寄宫支</option>
  </select>
  <button class="btn btn-primary btn-sm" type="button" id="lp-go">排盘</button>
  <button class="btn btn-sm" type="button" id="lp-selftest">自检 48 例</button>
  <span id="lp-testout" class="text-small" aria-live="polite"></span>
  <label class="form-label" for="lp-birth">出生年（本命）</label>
  <input class="form-control form-control-sm" type="number" id="lp-birth" min="1900" max="2029" placeholder="如 1990">
  <label class="form-label" for="lp-sex">性别</label>
  <select class="form-select form-select-sm" id="lp-sex">
    <option value="">不限</option><option value="m">男</option><option value="f">女</option>
  </select>
  <button class="btn btn-sm" type="button" id="lp-copy">复制报告</button>
</div>
<div id="lp-info" class="text-small" aria-live="polite" style="margin:6px 0;"></div>
<div class="lp-main">
  <div>
    <div class="lp-h">天地盘（格＝地盘 : 天盘·天将，＊空亡）</div>
    <div id="lp-board" role="img" aria-label="天地盘方阵"></div>
    <div id="lp-detail" class="text-small" style="margin-top:6px; min-height:2.4em;"></div>
  </div>
  <div id="lp-side" style="flex:1; min-width:300px;"></div>
</div>
<div id="lp-jie" style="margin-top:10px;"></div>
<div id="lp-ai-jie" style="margin-top:12px;">
  <div class="lp-h">AI 解盘</div>
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <input class="form-control form-control-sm" id="lp-ai-q" style="flex:1; min-width:280px;" placeholder="想问什么？（可选，如：今年适合换工作吗）">
    <button class="btn btn-sm btn-primary" id="lp-ai-run" type="button">AI 解盘</button>
    <button class="btn btn-sm" id="lp-ai-stop" type="button" disabled>停止</button>
    <span class="text-small text-muted" id="lp-ai-state"></span>
  </div>
  <div class="text-small text-muted" style="margin-top:4px;">AI 只基于本页盘面与规则解盘作答；需先在顶部「AI 配置」填写端点/Key/模型。默认不输出应期，明确追问“应期/何时”等才回答。结果仅供研习参考。</div>
  <div id="lp-ai-out" class="text-small" style="margin-top:8px; line-height:1.65;"></div>
</div>

  const LU = {甲:"寅",乙:"卯",丙:"巳",丁:"午",戊:"巳",己:"午",庚:"申",辛:"酉",壬:"亥",癸:"子"};
  const GANHE = {甲:"己",己:"甲",乙:"庚",庚:"乙",丙:"辛",辛:"丙",丁:"壬",壬:"丁",戊:"癸",癸:"戊"};
  const LH = {子:"丑",丑:"子",寅:"亥",亥:"寅",卯:"戌",戌:"卯",辰:"酉",酉:"辰",巳:"申",申:"巳",午:"未",未:"午"};

  function gzIndex(gz){const gi=GAN.indexOf(gz[0]),zi=J[gz[1]];
    for(let p=0;p<60;p++){if(p%10===gi&&p%12===zi)return p;}throw new Error("非法干支");}
  const md12 = x => ((x % 12) + 12) % 12;

  function xunInfo(day){
    const i = gzIndex(day), head = i - i % 10, hz = ZHI[head % 12];
    return {head: "甲" + hz, headZhi: hz,
      kong: [ZHI[(head+10)%12], ZHI[(head+11)%12]].sort((a,b)=>J[a]-J[b]),
      qiqi: XUNQI[head], yí: hz, wei: ZHI[(head+9)%12]};
  }
  function dunGan(day, z){
    const head = gzIndex(day) - gzIndex(day) % 10;
    const k = md12(J[z] - head % 12);
    return k < 10 ? GAN[k] : null;
  }
  function liuQin(gan, z){
    const a = GAN_WX[gan], b = ZHI_WX[z];
    if (a === b) return "兄弟";
    if (SHENG[a] === b) return "子孙";
    if (KE[a] === b) return "妻财";
    if (KE[b] === a) return "官鬼";
    return "父母";
  }
  function tianPan(y, h){ const o = {}; ZHI.forEach(p => o[p] = ZHI[md12(J[y] + J[p] - J[h])]); return o; }
  function invOf(tp){ const o = {}; for (const k in tp) o[tp[k]] = k; return o; }

  function siKe(day, hour, jiang, tp, cfg){
    const gan = day[0], zhi = day[1], seat = JIGONG[gan];
    const up1 = tp[seat], up2 = tp[up1], up3 = tp[zhi], up4 = tp[up3];
    const ganWx = GAN_WX[gan];
    const d1 = cfg.xiake === "gan"
      ? {下: gan, 下五行: ganWx, 下名: gan}
      : {下: seat, 下五行: ZHI_WX[seat], 下名: seat};
    const raw = [
      Object.assign({课:1, 上:up1, 下支:seat, 寄宫:seat}, d1),
      {课:2, 上:up2, 下:up1, 下支:up1, 下五行:ZHI_WX[up1], 下名:up1},
      {课:3, 上:up3, 下:zhi, 下支:zhi, 下五行:ZHI_WX[zhi], 下名:zhi},
      {课:4, 上:up4, 下:up3, 下支:up3, 下五行:ZHI_WX[up3], 下名:up3}
    ];
    const seen = new Set();
    for (const L of raw){
      L.上五行 = ZHI_WX[L.上];
      if (seen.has(L.上)) L.不备 = true; else { L.不备 = false; seen.add(L.上); }
      if (L.上五行 === L.下五行) L.关系 = null;
      else if (KE[L.上五行] === L.下五行) L.关系 = "克";
      else if (KE[L.下五行] === L.上五行) L.关系 = "贼";
      else L.关系 = null;
    }
    return raw;
  }

  function bi(pool, gan){
    const yang = GAN.indexOf(gan) % 2 === 0;
    return pool.filter(L => (J[L.上] % 2 === 0) === yang);
  }
  function depth(a, p, tp, cfg){
    const wx = ZHI_WX[a]; let n = 0, x = p; const path = [];
    for (let i = 0; i < 12; i++){ path.push(x); if (x === a) break; x = ZHI[md12(J[x] + 1)]; }
    for (const d of path){
      if (KE[ZHI_WX[d]] === wx) n++;
      if (KE[ZHI_WX[tp[d]]] === wx) n++;
    }
    return n;
  }
  function chain(chu, tp){ const zhong = tp[chu]; return [zhong, tp[zhong]]; }
  function rankMz(L){ const d = L.下支; return MENG.has(d) ? 2 : (ZHONG.has(d) ? 1 : 0); }

  function faSanChuan(day, hour, jiang, lessons, tp, cfg, notes){
    const gan = day[0], zhi = day[1], seat = JIGONG[gan];
    const y = J[jiang], h = J[hour];
    const yangDay = GAN.indexOf(gan) % 2 === 0;
    if (y === h){
      const act = lessons.filter(L => !L.不备 && L.关系);
      const zei = act.filter(L => L.关系 === "贼"), ke = act.filter(L => L.关系 === "克");
      let men = "伏吟", chu;
      if (zei.length || ke.length){
        chu = (zei.length ? zei : ke)[0].上;
        if (zei.length + ke.length > 1) notes.push("伏吟有克，多克并见，取先见者（待核）");
      } else chu = yangDay ? lessons[0].上 : lessons[2].上;
      let zhong = XING[chu];
      if (SELF.has(chu)){ zhong = yangDay ? lessons[2].上 : lessons[0].上; men = "杜传";
        notes.push("初传自刑：阳日用辰上、阴日用日上"); }
      let mo = XING[zhong];
      if (SELF.has(zhong)){ mo = ZHI[md12(J[zhong] + 6)]; notes.push("中传复自刑：末取冲"); }
      return {初:chu, 中:zhong, 末:mo, 门:men};
    }
    if (md12(y - h) === 6){
      const act = lessons.filter(L => !L.不备 && L.关系);
      const zei = act.filter(L => L.关系 === "贼"), ke = act.filter(L => L.关系 === "克");
      if (zei.length || ke.length){
        let pool = zei.length ? zei : ke;
        if (pool.length > 1){ const b = bi(pool, gan); pool = b.length ? b : pool; }
        const chu = pool[0].上; const [zhong, mo] = chain(chu, tp);
        if (!zei.length) notes.push("返吟无贼，取上克下");
        return {初:chu, 中:zhong, 末:mo, 门:"返吟（有克）"};
      }
      const q = cfg.jinglan === "juan5" ? (zhi === "丑" ? tp["巳"] : tp["亥"])
                                       : (zhi === "丑" ? tp["亥"] : tp["巳"]);
      notes.push("井栏取神两说，见 C-05");
      return {初:q, 中:lessons[2].上, 末:lessons[0].上, 门:"返吟·井栏射"};
    }
    const act = lessons.filter(L => !L.不备);
    const zei = act.filter(L => L.关系 === "贼"), ke = act.filter(L => L.关系 === "克");
    if (zei.length || ke.length){
      let pool = zei.length ? zei : ke;
      let men = zei.length ? "重审" : "元首";
      let chu;
      if (pool.length === 1) chu = pool[0].上;
      else {
        const cands = bi(pool, gan);
        if (cands.length === 1){ chu = cands[0].上; men = "知一（比用）"; }
        else {
          const pool2 = cands.length ? cands : pool;
          if (cfg.shenhai === "mengzhong"){
            let best = pool2[0];
            for (const L of pool2) if (rankMz(L) > rankMz(best)) best = L;
            chu = best.上;
            const r = rankMz(best);
            men = r === 2 ? "见机" : (r === 1 ? "察微" : "缀瑕");
          } else {
            let mx = -1; const top = [];
            for (const L of pool2){ const s = depth(L.上, L.下支, tp, cfg); if (s > mx) mx = s; }
            for (const L of pool2) if (depth(L.上, L.下支, tp, cfg) === mx) top.push(L);
            if (top.length === 1){
              chu = top[0].上;
              const d = top[0].下支;
              men = MENG.has(d) ? "见机" : (ZHONG.has(d) ? "察微" : "涉害");
            } else {
              chu = yangDay ? lessons[0].上 : lessons[2].上;
              men = "缀瑕（复等）";
              notes.push("涉害复等：刚日取干上、柔日取支上（C-04）");
            }
          }
        }
      }
      const [zhong, mo] = chain(chu, tp);
      return {初:chu, 中:zhong, 末:mo, 门:men};
    }
    if (zhi === seat){
      const upGan = lessons[0].上, upYin = lessons[3].上;
      const chu = yangDay ? ZHI[md12(J[upGan] + 2)] : ZHI[md12(J[upYin] - 2)];
      return {初:chu, 中:upGan, 末:upGan, 门:"八专"};
    }
    const yaoShen = act.filter(L => KE[L.上五行] === GAN_WX[gan]);
    const yaoRi = act.filter(L => KE[GAN_WX[gan]] === L.上五行);
    if (yaoShen.length || yaoRi.length){
      let pool = yaoShen.length ? yaoShen : yaoRi;
      const men = yaoShen.length ? "蒿矢" : "弹射";
      if (pool.length > 1){ const b = bi(pool, gan); pool = b.length ? b : pool; }
      const chu = pool[0].上; const [zhong, mo] = chain(chu, tp);
      return {初:chu, 中:zhong, 末:mo, 门:men};
    }
    if (lessons.some(L => L.不备)){
      let chu;
      if (yangDay) chu = tp[JIGONG[GANHE[gan]]];
      else chu = ZHI[md12(J[zhi] + (cfg.bieze === "prev" ? -2 : 2))];
      notes.push("柔日支前三合取法两说，见 C-07");
      return {初:chu, 中:lessons[0].上, 末:lessons[0].上, 门:"别责"};
    }
    if (yangDay) return {初:tp["酉"], 中:lessons[2].上, 末:lessons[0].上, 门:"昴星·虎视转蓬"};
    return {初:invOf(tp)["酉"], 中:lessons[0].上, 末:lessons[2].上, 门:"昴星·冬蛇掩目"};
  }

  function guiRen(gan, dn, order){
    const t = order === "p2" ? P2 : P1;
    return dn === "day" ? t[gan][0] : t[gan][1];
  }
  function buJiang(gan, hour, tp, daynight, cfg){
    let dn = daynight;
    if (!dn) dn = cfg.split === "zihou"
      ? (J[hour] >= 0 && J[hour] <= 5 ? "day" : "night")
      : (J[hour] >= 3 && J[hour] <= 8 ? "day" : "night");
    const gzDay = (cfg.order === "p2" ? P2 : P1)[gan][0];
    const gzNight = (cfg.order === "p2" ? P2 : P1)[gan][1];
    const gz = guiRen(gan, dn, cfg.order);
    const inv = invOf(tp), seat = inv[gz];
    const shun = J[seat] >= 11 || J[seat] <= 4;
    const jm = {};
    for (let k = 0; k < 12; k++) jm[ZHI[md12(J[gz] + (shun ? k : -k))]] = JIANG[k];
    return {jm, meta:{贵人:gz, 昼夜:dn, 临地盘:seat, 顺逆:shun ? "顺" : "逆", 派:cfg.order,
                      夜贵位:inv[gzNight]}};
  }

  function keTi(day, lessons, sc, tp, cfg, ctx){
    const gan = day[0], zhi = day[1], seat = JIGONG[gan];
    const out = [{名:sc.门, 依据:"PA-101～119"}];
    const ups = lessons.map(L => L.上);
    const chuan = [sc.初, sc.中, sc.末];
    const xi = ctx.xi, mj = ctx.mj, jm = ctx.jm;
    const wang = wx => WANG[mj] ? WANG[mj][wx] : "休";
    const ganWx = GAN_WX[gan], zhiWx = ZHI_WX[zhi];
    if (lessons.some(L => L.不备)) out.push({名:"不备", 依据:"KT-不备"});
    // 八专（干支同位）：独立于发用门（直指 720 丁未返吟局同标"反吟/八专/井栏射"）
    if (zhi === seat && !out.some(k => k.名 === "八专")) out.push({名:"八专", 依据:"QD-132"});
    const d1 = md12(J[chuan[1]] - J[chuan[0]]), d2 = md12(J[chuan[2]] - J[chuan[1]]);
    if (d1 === 1 && d2 === 1) out.push({名:"顺连茹（进茹）", 依据:"KT-连茹"});
    else if (d1 === 11 && d2 === 11) out.push({名:"逆连茹（退茹）", 依据:"KT-连茹"});
    else if (d1 === 2 && d2 === 2) out.push({名:"顺间传", 依据:"KT-间传"});
    else if (d1 === 10 && d2 === 10) out.push({名:"逆间传", 依据:"KT-间传"});
    for (const trio in SANHE)
      if (new Set(chuan).size === 3 && trio.split("").every(z => chuan.includes(z)))
        { out.push({名:"全局·" + SANHE[trio], 依据:"KT-011"}); break; }
    if (chuan.every(z => MENG.has(z))) out.push({名:"玄胎", 依据:"KT-玄胎"});
    if (ZHONG.has(zhi) && chuan.every(z => ZHONG.has(z))) out.push({名:"三交", 依据:"KT-三交"});
    if (chuan.every(z => "辰戌丑未".includes(z))) out.push({名:"稼穑（三传全季）", 依据:"KT-011"});
    if (chuan.every(z => J[z] % 2 === 0) && ups.every(u => J[u] % 2 === 0))
      out.push({名:"六阳", 依据:"KT-六阳"});
    if (chuan.every(z => J[z] % 2 === 1) && ups.every(u => J[u] % 2 === 1))
      out.push({名:"六阴", 依据:"KT-六阴"});
    const nKe = lessons.filter(L => L.关系 === "克").length;
    const nZei = lessons.filter(L => L.关系 === "贼").length;
    if (nKe === 4) out.push({名:"无禄", 依据:"QD-184"});
    if (nZei === 4) out.push({名:"绝嗣", 依据:"QD-185"});
    if (nKe === 3) out.push({名:"度厄（幼）", 依据:"QD-183"});
    if (nZei === 3) out.push({名:"度厄（长）", 依据:"QD-183"});
    if (xi.qiqi === sc.初) out.push({名:"三奇", 依据:"QD-143"});
    if (xi.yí === sc.初) out.push({名:"六仪", 依据:"QD-145"});
    if (chuan.some(z => jm[z] === "玄武") ||
        (sc.初 === xi.wei && tp[xi.yí] === xi.wei))
      out.push({名:"闭口", 依据:"QD-164"});
    if (lessons[0].上 === "辰" || lessons[0].上 === "戌" ||
        lessons[2].上 === "辰" || lessons[2].上 === "戌")
      out.push({名:"斩关", 依据:"QD-162"});
    if (seat !== zhi && tp[seat] === zhi){
      if (KE[ganWx] === zhiWx) out.push({名:"赘婿（残下）", 依据:"QD-176"});
      if (KE[zhiWx] === ganWx) out.push({名:"乱首（自取）", 依据:"QD-174"});
    } else if (tp[zhi] === seat && KE[zhiWx] === ganWx)
      out.push({名:"乱首（上门）", 依据:"QD-174"});
    const upWx = ZHI_WX[sc.初];
    if (mj){
      const wp = x => wang(x) === "旺" || wang(x) === "相";
      if (wp(upWx) && wp(ganWx) && wp(zhiWx) && JIANG_XI.has(jm[chuan[1]]))
        out.push({名:"三光", 依据:"QD-139"});
      if (ctx.shunni === "顺" && wp(ganWx) && wp(upWx))
        out.push({名:"三阳（推定）", 依据:"QD-140"});
      if (chuan[0] === "巳" && chuan[1] === "戌" && chuan[2] === "卯")
        out.push({名:"铸印", 依据:"QD-151"});
      for (const L of lessons)
        if (L.上 === "卯" && (L.下支 === "申" || L.下支 === "酉"))
          { out.push({名:"斫轮", 依据:"QD-152"}); break; }
      if (new Set(chuan).size === 3 && ["午","卯","子"].every(z => chuan.includes(z)))
        out.push({名:"高盖乘轩", 依据:"QD-110、QD-173"});
      if (sc.初 === "午" && chuan.includes("卯") && chuan.includes("子"))
        out.push({名:"轩盖", 依据:"QD-150"});
      if (SHENG[ZHI_WX[chuan[0]]] === ZHI_WX[chuan[1]] &&
          SHENG[ZHI_WX[chuan[1]]] === ZHI_WX[chuan[2]])
        out.push({名:"亨通（递生）", 依据:"QD-154"});
      if (chuan.every(z => "辰戌丑未".includes(z))){
        let ding = null;
        for (const z of ZHI) if (dunGan(day, z) === "丁"){ ding = z; break; }
        if ((ding && chuan.includes(ding)) || chuan.includes(YIMA_ZHI[zhi]))
          out.push({名:"游子", 依据:"QD-170"});
      }
      if ((zhi === "卯" || zhi === "酉") && (sc.初 === "卯" || sc.初 === "酉"))
        out.push({名:"龙战", 依据:"QD-197"});
      if (KE[ZHI_WX[ctx.hour]] === ganWx && KE[upWx] === ganWx)
        out.push({名:"天网（推定）", 依据:"QD-193"});
      if (sc.初 === "卯" || sc.初 === "酉"){
        if (jm[sc.初] === "天后") out.push({名:"泆女", 依据:"QD-178"});
        else if (jm[sc.初] === "六合") out.push({名:"狡童", 依据:"QD-178"});
      }
      if (lessons[0].上 === xi.kong[0] || lessons[0].上 === xi.kong[1] ||
          lessons[1].上 === xi.kong[0] || lessons[1].上 === xi.kong[1])
        out.push({名:"孤辰", 依据:"QD-181"});
      if (lessons[2].上 === xi.kong[0] || lessons[2].上 === xi.kong[1] ||
          lessons[3].上 === xi.kong[0] || lessons[3].上 === xi.kong[1])
        out.push({名:"寡宿", 依据:"QD-181"});
      if (ctx.guiDaySeat === "卯" || ctx.guiDaySeat === "酉" ||
          ctx.guiNightSeat === "卯" || ctx.guiNightSeat === "酉")
        out.push({名:"励德", 依据:"ZN-065"});
    }
    return out;
  }

  function pan(day, hour, jiang, daynight, cfg){
    cfg = Object.assign({order:"p1", split:"maoyou", shenhai:"depth", xiake:"gan",
                         jinglan:"juan5", bieze:"prev"}, cfg || {});
    const notes = [];
    const tp = tianPan(jiang, hour);
    const lessons = siKe(day, hour, jiang, tp, cfg);
    const sc = faSanChuan(day, hour, jiang, lessons, tp, cfg, notes);
    const bj = buJiang(day[0], hour, tp, daynight, cfg);
    const xi = xunInfo(day);
    const mj = ZHI[md12(13 - J[jiang])];
    const inv = invOf(tp);
    for (const L of lessons){ L.天将 = bj.jm[L.上]; L.遁干 = dunGan(day, L.上);
      L.空亡 = xi.kong.includes(L.上); }
    const chuan = [["初", sc.初], ["中", sc.中], ["末", sc.末]].map(([t, z]) =>
      ({传:t, 支:z, 天将:bj.jm[z], 遁干:dunGan(day, z), 空亡:xi.kong.includes(z),
        六亲:liuQin(day[0], z)}));
    const ctx = {xi, mj, jm:bj.jm, hour, guiDaySeat:bj.meta.临地盘,
                 guiNightSeat:bj.meta.夜贵位, shunni:bj.meta.顺逆};
    const keti = keTi(day, lessons, sc, tp, cfg, ctx);
    return {day, hour, jiang, daynight: bj.meta.昼夜, tp, lessons, sc, chuan, xi, mj,
            jm:bj.jm, meta:bj.meta, keti, notes};
  }

  return {pan, ZHI, J, GAN, GAN_WX, ZHI_WX, KE, KE_WO, SHENG, WANG, dunGan, liuQin, gzIndex,
          xunInfo, tianPan, JIGONG, JIANG};
})();
if (typeof module !== "undefined") module.exports = LREN;
/*LREN-END*/

  }
  if (!bestT) return null;
  const term = bestT.split("-")[1];
  const m = {雨水:"亥",春分:"戌",谷雨:"酉",小满:"申",夏至:"未",大暑:"午",
             处暑:"巳",秋分:"辰",霜降:"卯",小雪:"寅",冬至:"丑",大寒:"子"};
  return {zhi: m[term], term};
}

function getCfg(){
  return {order: document.getElementById("lp-order").value,
          split: "maoyou", shenhai: document.getElementById("lp-shenhai").value,
          xiake: document.getElementById("lp-xiake").value};
}

function render(){
  const dateStr = document.getElementById("lp-date").value;
  const timeStr = document.getElementById("lp-time").value || "12:00";
  const zhan = document.getElementById("lp-zhan").value;
  const dnSel = document.getElementById("lp-dn").value;
  const jiangSel = document.getElementById("lp-jiang").value;
  const cfg = getCfg();
  let dayGz, hour, jiang, src;
  if (jiangSel === "auto"){
    const r = jiangFor(dateStr, timeStr);
    if (!r){ info("日期超出内置节气范围（1984–2043），请手工选择月将。"); return; }
    jiang = r.zhi; src = r.term + "后";
  } else { jiang = jiangSel; src = "手工"; }
  // 日干支由内置60甲子推算：以 1984-01-31 甲子日为锚（lunar_python 校验）；23:00 后按次日（day_boundary=23:00，与 CLI 一致）
  const hh0 = parseInt(timeStr.split(":")[0], 10);
  const d0 = new Date("1984-01-31T12:00:00Z");
  const dd0 = new Date(dateStr + "T12:00");
  if (hh0 >= 23) dd0.setDate(dd0.getDate() + 1);
  const d1 = new Date(Date.UTC(dd0.getFullYear(), dd0.getMonth(), dd0.getDate(), 12));
  const idx = Math.round((d1 - d0) / 86400000);
  const gi = ((idx % 60) + 60) % 60;
  dayGz = "甲乙丙丁戊己庚辛壬癸"[gi % 10] + LREN.ZHI[gi % 12];
  hour = LREN.ZHI[Math.floor(((new Date(dateStr + "T" + timeStr)).getHours() + 1) % 24 / 2) % 12];
  const dn = dnSel === "auto" ? null : dnSel;
  const r = LREN.pan(dayGz, hour, jiang, dn, cfg);
  r.src = src;
  draw(r, zhan, dateStr + " " + timeStr);
  renderJie(r, zhan);
  if (window.zcode && window.zcode.setWidgetState)
    window.zcode.setWidgetState({privateContent: {date:dateStr, time:timeStr, zhan, dn:dnSel,
      jiang:jiangSel, cfg, birth:document.getElementById("lp-birth").value,
      sex:document.getElementById("lp-sex").value}}).catch(() => {});
}

    + `月建 ${r.mj}　旬 ${r.xi.head}　空亡 ${r.xi.kong.join("、")}　`
    + `贵人 ${r.meta.贵人}（${r.meta.昼夜}占·${r.meta.派}）临${r.meta.临地盘}${r.meta.顺逆}行`
    + (zhan ? `　占事：${zhan}` : "");
  r.占时 = r.hour;
  const board = document.getElementById("lp-board");
  board.innerHTML = "";
  const inv = {}; for (const k in r.tp) inv[r.tp[k]] = k;
  for (const row of GRID){

      cell.setAttribute("data-tooltip",
        `${z}宫：天盘${t}（${wx}）乘${j}　遁${LREN.dunGan(r.day, t) || "—"}｜${kong.has(t) ? "空亡" : "不空"}`
        + (isSan ? "｜入三传" : ""));

        + `<div class="lp-glyph" style="color:${WXCOLOR[wx]}">${t}</div>`

    ).join("　");

  }

    const j = r.jm[z];

             : j === "朱雀" ? (LREX.QUE_XIANG[z] || "") : "";
    const chip = document.createElement("span");
    chip.className = "lp-chip cursor-interaction";

    chip.addEventListener("click", () => {

  }
  jx.appendChild(jrow); side.appendChild(jx);

  const kd = document.createElement("div");

  }
  side.appendChild(kd);

function copyReport(){
  const dateStr = document.getElementById("lp-date").value;
  const timeStr = document.getElementById("lp-time").value || "12:00";
  const year = parseInt(dateStr.slice(0, 4), 10);
  const dg = (function(){
    const d0 = new Date("1984-01-31T12:00:00Z");
    const dd = new Date(dateStr + "T12:00");
    if (parseInt(timeStr.split(":")[0], 10) >= 23) dd.setDate(dd.getDate() + 1);  // 23:00 后按次日（与 CLI 一致）
    const i = Math.round((Date.UTC(dd.getFullYear(), dd.getMonth(), dd.getDate(), 12) - d0.getTime()) / 86400000);
    return "甲乙丙丁戊己庚辛壬癸"[((i % 60) + 60) % 60 % 10] + LREN.ZHI[((i % 12) + 12) % 12];
  })();
  const jAuto = document.getElementById("lp-jiang").value === "auto";
  const jf = jAuto ? jiangFor(dateStr, timeStr) : null;
  if (jAuto && !jf){ info("日期超出内置节气范围（1984–2043），报告未生成。"); return; }
  const r = LREN.pan(dg,
    LREN.ZHI[Math.floor(((new Date(dateStr + "T" + timeStr)).getHours() + 1) % 24 / 2) % 12],
    jAuto ? jf.zhi : document.getElementById("lp-jiang").value,
    document.getElementById("lp-dn").value === "auto" ? null
      : document.getElementById("lp-dn").value, getCfg());
  const ex = LREX.extras(r, parseInt(document.getElementById("lp-birth").value, 10) || null,
    document.getElementById("lp-sex").value, year);
  const lines = [];
  lines.push(`大六壬课盘 ${dateStr} ${timeStr}`);
  lines.push(`占日 ${r.day}　${r.hour}时　月将 ${r.jiang}　月建 ${r.mj}　旬 ${r.xi.head}　空亡 ${r.xi.kong.join("、")}`);
  lines.push("四课：" + r.lessons.map((L, i) => `${["一","二","三","四"][i]}课${L.上}/${L.下名}·${L.天将}`).join("　"));
  lines.push("三传：" + r.chuan.map(c => `${c.传}${c.支}(${c.天将},遁${c.遁干 || "—"},${c.六亲})`).join("　"));
  lines.push("发用：" + r.sc.门);
  lines.push("课体：" + r.keti.map(k => k.名).join("、"));
  if (ex.nm) lines.push(`年命：本命 ${ex.nm.本命}(上神${ex.nm.本命上神})` + (ex.nm.行年 ? `　行年 ${ex.nm.行年}(上神${ex.nm.行年上神})` : ""));
  lines.push("神煞：" + ex.ss.map(s => `${s.name}${s.z}${s.mark}`).join("、"));
  lines.push("解盘：");
  for (const sec of LREX.jiexi(r, ex.ss, document.getElementById("lp-zhan").value || null, year)){
    lines.push("【" + sec.t + "】");
    for (const it of sec.items) lines.push("  · " + it.s + (it.src ? "［" + it.src + "］" : ""));
  }
  const txt = lines.join("\n");
  const done = ok => info(ok ? "报告已复制到剪贴板"
    : "剪贴板不可用（如 iframe/无权限环境），报告已显示在详情区，可手动选取复制");
  // 兜底：textarea + execCommand（clipboard API 不可用或被拒时）
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      if (!ok) document.getElementById("lp-detail").textContent = txt;
      done(ok);
    } catch (e) { document.getElementById("lp-detail").textContent = txt; done(false); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(() => done(true), fallback);
  else fallback();
}

function selfTest(){
  const out = document.getElementById("lp-testout");
  let pass = 0; const bad = [];
  for (const g of GOLD){
    const r = LREN.pan(g.day, g.hour, g.jiang, g.dn, {});
    const four = r.lessons.map(L => [L.上, L.下名]);
    const san = r.chuan.map(c => [c.支, c.天将]);
    const kt = r.keti.map(k => k.名);
    const kong = r.xi.kong.slice().sort();
    const e = g.exp;
    // 课体：文献课例（lit=1）是"文献选标"（未必列全），只要求金标标签全部命中、允许按原文补标；
    // 随机盘（lit=0）是引擎回归基线，要求集合全等（防增删退化）。
    const ktOk = g.lit ? e.kt.every(n => kt.includes(n))
                       : JSON.stringify(kt) === JSON.stringify(e.kt);
    const ok = JSON.stringify(four) === JSON.stringify(e.four)
      && JSON.stringify(san) === JSON.stringify(e.san)
      && r.sc.门 === e.men && JSON.stringify(kong) === JSON.stringify(e.kong)
      && ktOk;
    if (ok) pass++;
    else bad.push(`${g.day}${g.hour}将${g.jiang}: 门${r.sc.门}/${e.men}` + (ktOk ? "" : " 课体"));
  }
  out.textContent = `${pass}/${GOLD.length} 过` + (bad.length ? "　未过：" + bad.slice(0, 3).join("；") : "");
}

  aiStatusRefresh();

  document.getElementById("lp-ai-toggle").addEventListener("click", () => {

  });

  document.getElementById("lp-ai-save").addEventListener("click", () => {
    const cfg2 = {
      url: document.getElementById("lp-ai-url").value.trim(),
      key: document.getElementById("lp-ai-key").value.trim(),

    };

    aiStatusRefresh();
    document.getElementById("lp-ai-status").textContent = ok ? "配置已保存（仅本机）" : "保存失败（localStorage 不可用）";
  });
  document.getElementById("lp-ai-test").addEventListener("click", async () => {
    const st = document.getElementById("lp-ai-state");
    const btn = document.getElementById("lp-ai-test");
    st.textContent = "测试中…"; btn.disabled = true;
    try {
      const cfg2 = aiCfgLoad();
      if (!aiCfgReady(cfg2)) throw new Error("未配置端点/Key/模型");
      const r = await fetch(aiEndpoint(cfg2.url), {
        method: "POST",
        headers: {"Content-Type": "application/json", "Authorization": "Bearer " + cfg2.key},
        body: JSON.stringify({model: cfg2.model, messages: [{role: "user", content: "ping"}], max_tokens: 8}),
        signal: AbortSignal.timeout(20000)
      });
      if (!r.ok){
        const t = await r.text().catch(() => "");
        throw new Error("HTTP " + r.status + "：" + t.slice(0, 120));
      }
      st.textContent = "连接成功（HTTP " + r.status + "，端点可用）";
    } catch (e) {
      st.textContent = "连接失败：" + (e && e.message ? e.message : String(e)).slice(0, 160);

  document.getElementById("lp-ai-run").addEventListener("click", runAI);

function aiEndpoint(url){
  let u = String(url || "").trim().replace(/\/+$/, "");
  if (!u) return "";
  if (/\/chat\/completions$/i.test(u) || /\/completions$/i.test(u)) return u;
  return u + "/chat/completions";
}

let AI_CTRL = null;

async function aiCall(messages, maxTokens, cfg, onDelta){
  cfg = cfg || aiCfgLoad();
  if (!aiCfgReady(cfg)) throw new Error("请先在顶部「AI 配置」填写端点、Key、模型");
  const ctl = new AbortController();
  AI_CTRL = ctl;
  const watchdog = setTimeout(() => { try { ctl.abort(); } catch (e) {} }, 900000);
  try {
    const resp = await fetch(aiEndpoint(cfg.url), {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": "Bearer " + cfg.key},
      body: JSON.stringify({model: cfg.model, messages, temperature: 0.7,
                            max_tokens: maxTokens || 8192, stream: true}),
      signal: ctl.signal
    });
    if (!resp.ok){
      const text = await resp.text().catch(() => "");
      let msg = text.slice(0, 200);
      try { const j = JSON.parse(text); msg = (j.error && (j.error.message || JSON.stringify(j.error))) || msg; } catch (e) {}
      throw new Error("HTTP " + resp.status + "：" + msg);
    }
    const ct = (resp.headers.get("content-type") || "").toLowerCase();
    if (ct.indexOf("text/event-stream") >= 0 && resp.body && resp.body.getReader){
      const reader = resp.body.getReader(); const dec = new TextDecoder();
      let buf = "", content = "", rlen = 0;
      while (true){
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
        let cut;
        while ((cut = buf.indexOf("\n\n")) >= 0){
          const evt = buf.slice(0, cut); buf = buf.slice(cut + 2);
          for (const line of evt.split("\n")){
            if (line.indexOf("data:") !== 0) continue;
            const ds = line.slice(5).trim();
            if (!ds || ds === "[DONE]") continue;
            let j; try { j = JSON.parse(ds); } catch (e) { continue; }
            const dlt = j.choices && j.choices[0] && j.choices[0].delta;
            if (!dlt) continue;
            if (dlt.reasoning_content) rlen += String(dlt.reasoning_content).length;
            if (dlt.content){
              content += dlt.content;
              if (onDelta) onDelta({ content, reasoning: rlen });
            } else if (dlt.reasoning_content && onDelta){
              onDelta({ content, reasoning: rlen });
            }
          }
        }
      }
      if (!content.trim()) throw new Error("模型只输出思考、正文为空：请提高 max_tokens（如 8192+）或更换非推理模型");
      return content;
    }
    const text = await resp.text();
    let data = null; try { data = JSON.parse(text); } catch (e) { data = null; }
    if (!data) throw new Error("响应不是 JSON：" + text.slice(0, 120));
    const ch0 = data.choices && data.choices[0];
    const content = ch0 && (ch0.message ? ch0.message.content : ch0.text);
    if (!content || !String(content).trim())
      throw new Error("模型只输出思考、正文为空：请提高 max_tokens（如 8192+）或更换非推理模型");
    if (onDelta) onDelta({ content: String(content), reasoning: 0 });
    return String(content);
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error("已停止");
    throw e;
  } finally {
    clearTimeout(watchdog);
    if (AI_CTRL === ctl) AI_CTRL = null;
  }
}

function aiStopAI(){ if (AI_CTRL){ try { AI_CTRL.abort(); } catch (e) {} } }

function buildAiBrief(r, ex, zhan, year, question, allow){
  const lines = [];
  lines.push("【课盘】占日 " + r.day + " " + r.hour + "时；月将 " + r.jiang + "；月建 " + r.mj + "；旬 " + r.xi.head + "；空亡 " + r.xi.kong.join("、"));
  lines.push("四课：" + r.lessons.map((L, i) => ["一","二","三","四"][i] + "课" + L.上 + "/" + L.下名 + "·" + L.天将).join("；"));
  lines.push("三传：" + r.chuan.map(c => c.传 + "传" + c.支 + "（" + c.天将 + "，遁" + (c.遁干 || "—") + "，" + c.六亲 + "）").join("；"));
  lines.push("课体：" + r.keti.map(k => k.名).join("、"));
  if (ex && ex.nm) lines.push("年命：本命 " + ex.nm.本命 + "（上神 " + ex.nm.本命上神 + "）" + (ex.nm.行年 ? "；行年 " + ex.nm.行年 + "（上神 " + ex.nm.行年上神 + "）" : ""));
  if (ex && ex.ss){
    const mark = ex.ss.filter(s => s.mark).map(s => s.name + s.z + s.mark).join("、");
    if (mark) lines.push("神煞（●入传 ◎临干支）：" + mark);
  }
  if (zhan) lines.push("占事：" + zhan);
  lines.push("");
  lines.push("【规则解盘（可引用，引用须带出处）】");
  for (const sec of LREX.jiexi(r, ex ? ex.ss : [], zhan || null, year)){
    lines.push("【" + sec.t + "】");
    for (const it of sec.items) lines.push("· " + it.s + (it.src ? "［" + it.src + "］" : ""));
  }
  if (allow && window.YQ){
    lines.push("");
    lines.push("【应期数据（用户本轮明确要求，可引用）】");
    lines.push(YQ.plain(YQ.liuren(r, ex, zhan, document.getElementById("lp-date").value)));
  } else {
    lines.push("");
    lines.push("【应期】本轮用户未明确要求，不要输出应期或具体时间。");
  }
  if (question){ lines.push(""); lines.push("【用户问题】" + question); }
  return lines.join(NL);
}

async function runAI(){
  const st = document.getElementById("lp-ai-state");
  const out = document.getElementById("lp-ai-out");
  const btn = document.getElementById("lp-ai-run");
  const stop = document.getElementById("lp-ai-stop");
  const cfg = aiCfgLoad();
  if (!aiCfgReady(cfg)){ st.textContent = "未配置 API（点顶部「AI 配置」）"; return; }
  if (!LAST_PAN){ st.textContent = "请先排盘"; return; }
  const q = document.getElementById("lp-ai-q").value.trim();
  const allow = window.YQ ? YQ.explicit(q) : false;
  const sys = (cfg.sys || AI_PERSONAS[cfg.persona] || AI_PERSONAS["研习者（严谨引据）"]) + NL + AI_RULES
    + NL + (window.YQ ? YQ.aiRule(allow) : "");
  const brief = buildAiBrief(LAST_PAN, LAST_EX, LAST_ZHAN, LAST_YEAR, q, allow);
  const t0 = Date.now(); let rlen = 0;
  btn.disabled = true; if (stop) stop.disabled = false;
  out.textContent = "";
  st.textContent = "请求中…（流式生成，长思考不设硬超时）";
  const tick = setInterval(() => {
    st.textContent = "生成中… " + Math.round((Date.now() - t0) / 1000) + "s（思考 " + rlen + " 字 / 正文 " + out.textContent.length + " 字）";
  }, 1000);
  try {
    const content = await aiCall(
      [{role: "system", content: sys}, {role: "user", content: brief}], 8192, cfg,
      (s) => { rlen = s.reasoning; out.textContent = s.content; });
    out.textContent = content;
    st.textContent = "完成（" + content.length + " 字 / " + Math.round((Date.now() - t0) / 1000) + "s，思考 " + rlen + " 字）";
  } catch (e) {
    const msg = (e && e.message) || String(e);
    const stopped = msg === "已停止";
    st.textContent = stopped ? "已停止" : "失败";
    out.textContent = "【错误】" + msg + NL + NL +
      "排查：①端点填基础地址即可（如 https://host/v1，会自动补 /chat/completions）；②Key 与模型名是否正确；③若提示 Failed to fetch，多为端点不允许浏览器跨域（CORS）。" + NL +
      "（提示词只含本页课盘与规则，不含你的 API Key。）";
  } finally {
    clearInterval(tick);
    btn.disabled = false;
    if (stop) stop.disabled = true;
  }
}

<script>
// 轻量 tooltip（导出环境无宿主沙箱时替代 data-tooltip 机制）
(function(){
  let tip = null;
  function show(e){
    const el = e.currentTarget, txt = el.getAttribute("data-tooltip");
    if (!txt) return;
    hide();
    tip = document.createElement("div");
    tip.className = "tooltip"; tip.textContent = txt;
    document.body.appendChild(tip);
    const r = el.getBoundingClientRect();
    tip.style.left = Math.max(4, Math.min(window.innerWidth - tip.offsetWidth - 4,
      r.left + r.width / 2 - tip.offsetWidth / 2)) + "px";
    tip.style.top = (r.top > 60 ? r.top - tip.offsetHeight - 6 : r.bottom + 6)
      + window.scrollY + "px";
  }
  function hide(){ if (tip){ tip.remove(); tip = null; } }
  document.addEventListener("mouseover", e => {
    const el = e.target.closest("[data-tooltip]");
    if (el){ show({currentTarget: el}); } else hide();
  });
  document.addEventListener("focusin", e => {
    const el = e.target.closest("[data-tooltip]");
    if (el) show({currentTarget: el});
  });
  document.addEventListener("focusout", hide);
  window.addEventListener("scroll", hide, true);
})();
</script>
